# Example. Change `app` to a unique name. Deploy from the repository root:
#   fly deploy --config deploy/relay/fly.toml --dockerfile deploy/relay/Dockerfile
app = "my-cma-relay"
primary_region = "ams"

# Fly's proxy sets X-Forwarded-For; the relay rate-limits on it with --trust-proxy.
[experimental]
  cmd = ["--trust-proxy"]

[mounts]
  source = "cma_relay_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
